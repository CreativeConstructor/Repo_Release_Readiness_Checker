services:
  api:
    build: "."  
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./:/express-app
      - /express-app/node_modules
    command: npm run dev
    depends_on:
      - db

  db:
    image: postgres:17-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data:
      
